[project]
name = "ark-nova-tournament-dashboard"
version = "0.1.0"
description = "Dashboard for an ongoing two-table Ark Nova tournament"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "plotly>=5.24,<7",
    "streamlit>=1.38,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
